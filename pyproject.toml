[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-pipeline"
version = "1.0.0"
description = "Quality-control pipeline: LLM extraction of defect counts from inspection reports, threshold alerting, and tool-quality metrics."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    # anthropic is only needed for live mode; mock mode runs without it.
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
qc-pipeline = "qc_pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["qc_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
